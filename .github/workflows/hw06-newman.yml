name: HW06 API tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Newman suite to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smoke
  push:
    paths:
      - 'hw06/**'
      - 'backend/**'

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install Newman and HTML reporter
        run: npm install --no-save --prefix hw06 newman newman-reporter-htmlextra
      - name: Generate collection and start SUT
        run: |
          node hw06/scripts/generate_artifacts.js
          node backend/server.js > /tmp/eshop.log 2>&1 &
          npx wait-on http://127.0.0.1:3000/api/products
      - name: Run Newman regression suite
        run: |
          if [ "${{ inputs.suite || 'full' }}" = "smoke" ]; then
            npx newman run hw06/collections/23127001_HW06_API_CI_Smoke.postman_collection.json -r cli,json --reporter-json-export hw06/results/newman-ci-smoke.json
          else
            bash hw06/scripts/run_newman.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw06-newman-report
          path: hw06/results/
